<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Producto 1 - Go</title>
    <style>
        body {
            background: linear-gradient(135deg, #E3F545, #A0AD2F);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
            width: 420px;
        }

        h1 {
            color: #2c5aa0;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 18px;
            line-height: 1.5;
            margin: 10px 0;
        }

        img {
            margin-top: 20px;
            width: 260px;
            border-radius: 12px;
        }

        .pod {
            margin-top: 20px;
            padding: 12px 18px;
            background: #eef5ff;
            border: 1px solid #b7d1f3;
            border-radius: 10px;
            color: #1e4f8a;
            font-weight: bold;
            font-size: 17px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Soy alumno de la UOC</h1>
        <p>Aplicación web desarrollada con Go y Docker</p>
        <img src="/static/imagen.jpg" alt="CloudOps Lab">
        <div class="pod">POD_PLACEHOLDER</div>
    </div>
</body>
</html>
