<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Producto 1 - Go</title>
    <style>
        body {
            background: linear-gradient(135deg, #2c5aa0, #3a8ec1);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;

        h1 {
            color: #2c5aa0;
        }

            color: #666;
        }

        img {
            margin-top: 20px;
            width: 250px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Soy alumno de la UOC</h1>
        <p>Aplicación web desarrollada con Go y Docker</p>

</html>
